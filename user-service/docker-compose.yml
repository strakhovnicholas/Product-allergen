version: '3.9'
services:
  user-service:
    build: .
    image: n1vvas1e/user-service:v1
    container_name: user-service
    restart: on-failure
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/allergen_pg
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:allergen_mg@mongo:27017/health_tracker?authSource=admin
    networks:
      - backend-net

networks:
  backend-net:
    external: true