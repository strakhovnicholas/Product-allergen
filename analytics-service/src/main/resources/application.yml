spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres_analytics_db:5433/report_pg}
    username: ${SPRING_DATASOURCE_USERNAME:ANALYTICS-REPORT-POSTGRES-VELOSIPED}
    password: ${SPRING_DATASOURCE_PASSWORD:MW+D0uI2lX2P3q3WHw21sA==}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: ru.productallergen.analytics.*
    producer:
      properties:
        spring.json.add.type.headers: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

internal:
  api:
    secret: ${INTERNAL_SECRET}

report:
  template-path: templates/medical_report.jrxml
  kafka:
    request-topic: report-ai-requests
    response-topic: report-ai-results
    wait-timeout-seconds: 90

gigachat:
  auth-key: ${GIGACHAT_AUTH_KEY:}
  verify-ssl-certs: false
  # API id, not SDK constant name: use GigaChat-2-Max, GigaChat-2-Pro, GigaChat-2-Lite
  model: ${GIGACHAT_MODEL:GigaChat-2-Max}

app:
  security:
    internal-header: X-Internal-Gateway-Token
    user-id-header: X-User-Id
  internal:
    api:
      secret: ${INTERNAL_API_SECRET:my-default-secret}

logging:
  level:
    ru.productallergen.analytics: INFO
    ru.productallergen.analytics.kafka: INFO
    ru.productallergen.analytics.service.GigaChatAnalysisService: INFO
