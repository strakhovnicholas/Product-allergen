spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/allergen_pg}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  application:
    name: auth-service

  data:
    redis:
      host: redis
      port: 6379
      password: ""

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 900000
  refresh:
    expiration: 604800000
  claim:
    id: id
    role: role
    type: type
    token-type: access