spring:
  application:
    name: auth-service

  # PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

# JWT Token properties
jwt:
  secret: ${JWT_SECRET:}
  access:
    expiration: 900000  # 15 минут
  refresh:
    expiration: 604800000  # 7 дней
  claim:
    id: id
    role: role
    type: type
    token-type: access

# Cookie Configuration
cookie:
  access:
    name: accessToken
    path: /
    max-age: 3600
  refresh:
    name: refreshToken
    path: /auth/refresh
    max-age: 604800
  http-only: true
  secure: true
  same-site: None

# User Service URLs
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
    get-user-by-email: /users/email/{email}
    get-user-password-by-id: /users/{id}/check-password
    create: /users