spring:
  application:
    name: auth-service
  data:
    redis:
      host: redis
      port: 6379
      password: ""

# JWT settings
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 900000
  refresh:
    expiration: 604800000
  claim:
    id: id
    role: role
    type: type
    token-type: access