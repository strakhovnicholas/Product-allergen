spring:
  application:
    name: auth-service

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: redis
      port: 6379
      password: ""

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 900000
  refresh:
    expiration: 604800000
  claim:
    id: id
    role: role
    type: type
    token-type: access