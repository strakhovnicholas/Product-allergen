spring.application.name=auth-service

# JWT Token properties
jwt.secret = SL7GFwbppwEoIXBHVH7k9hxzN3dpy5eZLsRghMZRFAE=
# Token Expiration (in seconds)
jwt.access.expiration = 900000
jwt.refresh.expiration = 604800000

# Cookie Configuration
cookie.access.name = accessToken
cookie.access.path = /
cookie.access.max-age = 3600
cookie.refresh.name = refreshToken
cookie.refresh.path = /auth/refresh
cookie.refresh.max-age = 604800
cookie.http-only = true
cookie.secure = true
cookie.same-site = None

# User Service URLs
user.service.url = http://localhost:8081
user.service.get-user-by-email = /users/email/{email}
user.service.get-user-password-by-id = /users/{id}/check-password
user.service.create = /users

# Redis properties
spring.data.redis.host = localhost
spring.data.redis.port = 6379
spring.data.redis.password = 12345

# Token Claims
jwt.claim.id = id
jwt.claim.role = role
jwt.claim.type = type
jwt.claim.token-type = access